[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=7.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdb-flow"
dynamic = ["version"]
description = "A command-line tool for managing Architecture Decision Records (ADRs) in a Qdrant vector database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "cloro7", email = "claramartinordonez@gmail.com"}
]
keywords = ["vector-database", "qdrant", "adr", "embeddings", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "black==26.3.1",  # keep in sync with .pre-commit-config.yaml (psf/black rev); >=26.3.1 for CVE-2026-32274
    "flake8==7.3.0",  # keep in sync with .pre-commit-config.yaml (pycqa/flake8 rev)
    "flake8-docstrings>=1.7.0",  # matches pre-commit flake8 hook additional_dependencies
    "pre-commit>=3.0.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.0",
    "commitizen>=4.0.0",
]

[project.scripts]
vdb-flow = "vdb_flow.cli.main:main"

[project.entry-points."vdb_flow.adapters"]
# Entry points for third-party database adapters
# Example:
# pinecone = "vdb_flow_pinecone:register_pinecone_adapter"
# weaviate = "vdb_flow_weaviate:register_weaviate_adapter"

[project.entry-points."vdb_flow.embedding_adapters"]
# Entry points for third-party embedding adapters (register_embedding_adapter)
# Example: myembed = "my_pkg:register_embedding"

[project.urls]
Homepage = "https://github.com/cloro7/vdb-flow"
Repository = "https://github.com/cloro7/vdb-flow"
Issues = "https://github.com/cloro7/vdb-flow/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vdb_flow*"]
exclude = ["tests*", "*.tests*", "*.tests"]

[tool.setuptools_scm]
write_to = "src/vdb_flow/_version.py"
# Use default version scheme: if on a tag, use tag version; otherwise tag version + .devN
# This ensures versions come from git tags following semantic versioning
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

# Semantic versioning: tags like v1.2.3 (see README "Releases"). Version is read from Git only
# (setuptools-scm + Commitizen scm provider — no version committed to pyproject).
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = false
version_files = []

[tool.coverage.run]
branch = true
source = ["vdb_flow"]
omit = ["*/_version.py"]

[tool.coverage.report]
# CI runs `pytest tests/unit tests/integration --cov=vdb_flow` in one shot; same floor locally.
fail_under = 75
show_missing = true

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
| /_version\.py$
'''
